name: solik

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-solik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-solik}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-solik}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF persistence: delayed timer jobs survive Redis restarts
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-solik}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-solik}
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /data/uploads
      PORT: 4000
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "${API_PORT:-4000}:4000"

  worker:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-solik}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-solik}
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      api: { condition: service_started }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_MAIN_BOT_USERNAME: ${NEXT_PUBLIC_MAIN_BOT_USERNAME}
        API_INTERNAL_URL: http://api:4000
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  pg-data:
  redis-data:
  uploads:
